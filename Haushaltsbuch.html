<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" id="tc" content="#f4f6f5">
<script>try{var __t=localStorage.getItem("haushaltsbuch.theme");if(__t==="light"||__t==="dark")document.documentElement.setAttribute("data-theme",__t);}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Haushaltsbuch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Haushaltsbuch</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#14231f;--mute:#64748b;--line:#e2e8e6;--pri:#0f766e;--pri-ink:#fff;--out:#dc2626;--in:#16a34a;--chip:#eef2f1;--warn:#b45309;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1514;--card:#16201e;--ink:#e6efed;--mute:#93a5a1;--line:#243330;--pri:#2dd4bf;--pri-ink:#042f2a;--out:#f87171;--in:#4ade80;--chip:#1f2d2a;--warn:#fbbf24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1514;--card:#16201e;--ink:#e6efed;--mute:#93a5a1;--line:#243330;--pri:#2dd4bf;--pri-ink:#042f2a;--out:#f87171;--in:#4ade80;--chip:#1f2d2a;--warn:#fbbf24;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:20px;margin:0}
#status{font-size:12px;padding:6px 10px;border-radius:99px;background:var(--chip);color:var(--mute)}
#status.ok{color:var(--in)}#status.warn{color:var(--warn)}
.months{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.months button{width:44px;height:44px;border-radius:12px;background:var(--card);font-size:18px;border:1px solid var(--line)}
.months span{font-weight:600;font-size:17px}
body.nomonth .months{display:none}
main{padding:4px 16px}
section{display:none}section.on{display:block}
h2{font-size:18px;margin:12px 0 8px}
h3{font-size:13px;margin:18px 0 8px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum .card small{color:var(--mute);display:block}
.sum .card b{font-size:19px}
.sum .full{grid-column:1/-1}
.sum .full b{font-size:26px}
.neg{color:var(--out)}.pos{color:var(--in)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;flex:none}
.bar{padding:8px 0;border-bottom:1px solid var(--line)}.bar:last-child{border:0}
.bar-h{display:flex;justify-content:space-between;gap:8px}
.track{height:8px;border-radius:6px;background:var(--chip);margin:6px 0 2px;overflow:hidden}
.track div{height:100%;border-radius:6px}
.bar small{color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:36px 12px}
.day{font-size:13px;color:var(--mute);margin:16px 4px 6px;font-weight:600}
.entry{display:flex;align-items:center;width:100%;text-align:left;gap:4px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:6px;min-height:56px}
.entry .t{flex:1;min-width:0}.entry .t small{display:block;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry b{white-space:nowrap}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:14px;padding:4px;margin:6px 0 12px}
.seg button{padding:11px;border-radius:11px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.amount{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 16px}
.amount input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:36px;font-weight:700;padding:8px 0}
.amount span{font-size:28px;color:var(--mute)}
.lbl{font-size:13px;color:var(--mute);margin:16px 2px 8px;text-transform:uppercase;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;padding:11px 14px;border-radius:99px;background:var(--chip);border:1.5px solid transparent;min-height:44px}
.chip.on{border-color:var(--pri);background:var(--card);font-weight:600}
.chip.add{color:var(--pri);border:1.5px dashed var(--pri);background:none;font-weight:600}
.inline{display:flex;gap:8px;margin-top:10px}
.inline[hidden]{display:none}
input.f{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);outline:0;font-size:16px;min-height:48px}
input.f:focus{border-color:var(--pri)}
.field{display:block;margin-top:12px}.field span{display:block;font-size:13px;color:var(--mute);margin:0 2px 6px}
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--pri);color:var(--pri-ink);font-weight:700;text-align:center;min-height:50px}
.btn.sec{background:var(--chip);color:var(--ink);font-weight:600}
.btn.danger{background:none;color:var(--out);border:1px solid var(--out)}
.btn.sm{width:auto;padding:0 18px;flex:none}
.stack{display:grid;gap:10px;margin-top:10px}
.cat{display:flex;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);min-height:52px}.cat:last-child{border:0}
.cat .n{flex:1}.cat small{color:var(--mute);margin-right:6px}
.cat button{width:44px;height:44px;font-size:18px;border-radius:10px}
.note{font-size:13px;color:var(--mute);margin:8px 2px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;color:var(--mute);min-height:52px;position:relative}
nav button .ic{width:23px;height:23px}
nav button.on{color:var(--pri);font-weight:700}
nav button.plus .ic{background:var(--pri);color:var(--pri-ink);width:50px;height:50px;border-radius:50%;align-items:center;justify-content:center;margin-top:-22px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
nav button.plus .ic svg{width:26px;height:26px;stroke-width:2.4}
nav .badge{position:absolute;top:4px;right:calc(50% - 20px);width:9px;height:9px;border-radius:50%;background:var(--warn)}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#111;color:#fff;padding:11px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;font-size:14px;z-index:9;max-width:90vw;text-align:center}
#toast.on{opacity:.95;transform:translateX(-50%)}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg[hidden]{display:none}
.chip.sm{padding:6px 12px;min-height:36px;font-size:14px}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .zl{stroke:var(--mute);stroke-width:1}
.chart .axt{fill:var(--mute);font-size:10px}
.chart .bi{fill:var(--in)}.chart .bo{fill:var(--out)}
.chart .sel{fill:var(--chip)}
.chart .ln{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.chart .pt{fill:var(--card);stroke:var(--ink);stroke-width:1.5}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mute);margin-top:8px}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.sw.bi{background:var(--in)}.sw.bo{background:var(--out)}.sw.ln{height:3px;background:var(--ink);vertical-align:3px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;text-align:center}
.kpi small{display:block;color:var(--mute);font-size:12px}.kpi b{font-size:15px}
.kpi-t{margin-top:12px;font-size:13px;color:var(--mute);text-align:center}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.pie{width:210px;max-width:75%;display:block;margin:4px auto 8px}
.pie .ctr{fill:var(--ink);font-size:16px;font-weight:700}
.pie .axt{font-size:11px}
.leg-row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.leg-row:last-child{border:0}
.leg-row small{color:var(--mute);margin-left:6px}
.chips+.lbl{margin-top:14px}
.banner{background:var(--card);border:1.5px solid var(--pri);border-radius:16px;padding:14px;margin:8px 0 4px}
.banner[hidden]{display:none}
.banner b{display:block;margin-bottom:2px}
.banner .note{margin:2px 0 10px}
.banner .row2{display:flex;gap:8px}.banner .row2 .btn{flex:1}
details{margin-top:12px}summary{cursor:pointer;color:var(--mute);font-size:14px;padding:6px 0}
#modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.sheet h2{margin:0 0 6px;font-size:19px}
.row2{display:flex;gap:8px;margin-top:14px}.row2 .btn{flex:1}
.btn.warn{background:var(--out);color:#fff}
@media (min-width:600px){#modal{align-items:center}.sheet{border-radius:22px}}
.ic{display:inline-flex;width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{display:flex;align-items:center;gap:8px}
h1 .logo{color:var(--pri);width:26px;height:26px}
#status{display:inline-flex;align-items:center;gap:6px}
#status .ic{width:14px;height:14px}
.months button{display:grid;place-items:center}.months button .ic{width:20px;height:20px}
.cat button{display:grid;place-items:center}.cat button .ic{width:20px;height:20px}
.btn.sm .ic{width:22px;height:22px}
.banner b{display:flex;align-items:center;gap:8px}.banner b .ic{color:var(--pri);width:20px;height:20px}
.chip .ic{width:1em;height:1em;margin-right:6px}
.seg.four{grid-template-columns:repeat(4,1fr);gap:2px}
.seg.four button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;padding:8px 2px}
.seg.four button .ic{width:20px;height:20px}
.seg.three button .ic{margin-right:4px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.srow:last-of-type{border:0}
.pill{font-size:13px;padding:4px 10px;border-radius:99px;background:var(--chip);color:var(--mute);white-space:nowrap}
.pill.ok{color:var(--in)}.pill.warn{color:var(--warn)}
.steps{margin:8px 0 0;padding-left:20px;font-size:14px;color:var(--mute)}.steps li{margin:6px 0}
pre.code{background:var(--chip);border-radius:12px;padding:12px;font-size:11.5px;line-height:1.45;overflow:auto;max-height:260px;white-space:pre;margin:8px 0}
.spin .ic svg{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.seg.five{grid-template-columns:repeat(3,1fr);gap:2px}
.seg.five button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;padding:8px 2px}
.seg.five button .ic{width:20px;height:20px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-top:18px;text-align:left}
.toggle[hidden]{display:none}
.toggle small{display:block;color:var(--mute);font-size:13px;font-weight:400;margin-top:2px}
.toggle .sw{width:46px;height:28px;border-radius:99px;background:var(--chip);position:relative;flex:none;border:1px solid var(--line);transition:.2s}
.toggle .sw::after{content:'';position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--mute);transition:.2s}
.toggle.on .sw{background:var(--pri);border-color:var(--pri)}
.toggle.on .sw::after{left:20px;background:var(--pri-ink)}
#repOpts[hidden],#toBlock[hidden],#catBlock[hidden],#trPresets[hidden],#repBlock[hidden]{display:none}
.entry b.tr{color:var(--ink)}
.entry small .ic{width:.95em;height:.95em;margin-right:3px;vertical-align:-.12em}
.cat.ord{align-items:flex-start;padding:10px 0}
.cat.ord>.ic{width:22px;height:22px;margin:3px 10px 0 0;color:var(--pri)}
.cat.ord .n{min-width:0}
.cat.ord .n .l1{display:flex;justify-content:space-between;gap:8px}
.cat.ord .n small{display:block;margin:2px 0 0}
.cat.ord button{width:38px;height:38px}
.cat.ord.dim .n,.cat.ord.dim>.ic{opacity:.55}
.loan{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.loan:last-child{border-bottom:0}
.loan .t{flex:1;min-width:0}.loan .t small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.loan.done .t,.loan.done b{opacity:.5;text-decoration:line-through}
.loan .tag{font-size:11.5px;color:var(--mute);margin-left:6px;text-decoration:none}
#v-loans .sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
#v-loans .sum div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
#v-loans .sum small{display:block;color:var(--mute);font-size:12.5px}
#v-loans .sum b{font-size:18px}
.hrow{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px}.hrow h3{margin:0}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--chip);color:var(--ink);border:1px solid var(--line)}.iconbtn .ic{width:20px;height:20px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="top"><h1><span class="logo" data-ic="book"></span>Haushaltsbuch</h1><button id="status"></button></div>
    <div class="months"><button id="prev" aria-label="Vorheriger Monat"><span data-ic="left"></span></button><span id="mlabel"></span><button id="next" aria-label="Nächster Monat"><span data-ic="right"></span></button></div>
  </header>
  <main>
    <div id="banner" hidden></div>
    <div class="seg five" id="moreTabs" hidden><button data-m="cats"><span data-ic="tag"></span>Kategorien</button><button data-m="accts"><span data-ic="wallet"></span>Konten</button><button data-m="orders"><span data-ic="repeat"></span>Daueraufträge</button><button data-m="loans"><span data-ic="users"></span>Leihgaben</button><button data-m="excel"><span data-ic="cloud"></span>Daten</button><button data-m="settings"><span data-ic="sliders"></span>Einstellungen</button></div>
    <section id="v-overview"></section>
    <section id="v-history"></section>
    <section id="v-stats">
      <h2>Auswertung</h2>
      <div class="card" id="stFilters"></div>
      <h3>Umsatzverlauf</h3>
      <div class="card" id="chLine"></div>
      <h3>Anteile nach Kategorie</h3>
      <div class="card" id="chPie"></div>
    </section>

    <section id="v-add">
      <h2 id="addTitle">Neue Buchung</h2>
      <div class="seg three" id="addSeg"><button data-t="out">Ausgabe</button><button data-t="in">Einnahme</button><button data-t="tr"><span data-ic="transfer"></span>Umbuchung</button></div>
      <label class="amount"><input id="amt" inputmode="decimal" placeholder="0,00" autocomplete="off"><span>€</span></label>
      <div id="trPresets" hidden>
        <div class="lbl">Schnellauswahl</div>
        <div class="chips"><button class="chip" data-preset="withdraw"><span data-ic="banknote"></span>Bargeld abheben</button><button class="chip" data-preset="deposit"><span data-ic="banknote"></span>Bargeld einzahlen</button></div>
      </div>
      <div id="catBlock">
        <div class="lbl">Kategorie</div>
        <div class="chips" id="chips"></div>
        <div class="inline" id="newcat" hidden>
          <input class="f" id="newcatName" placeholder="Name der neuen Kategorie" maxlength="40" autocomplete="off">
          <button class="btn sm" id="newcatOk">OK</button>
        </div>
      </div>
      <div class="lbl" id="acctLbl">Konto</div>
      <div class="chips" id="acctChips"></div>
      <div id="toBlock" hidden>
        <div class="lbl">Nach Konto</div>
        <div class="chips" id="toChips"></div>
      </div>
      <div class="inline" id="newacct" hidden>
        <input class="f" id="newacctName" placeholder="Name des neuen Kontos" maxlength="40" autocomplete="off">
        <button class="btn sm" id="newacctOk">OK</button>
      </div>
      <label class="field"><span id="dtLbl">Datum</span><input class="f" type="date" id="dt"></label>
      <label class="field"><span>Notiz (optional)</span><input class="f" id="note" maxlength="80" autocomplete="off"></label>
      <div id="repBlock">
        <button class="toggle" id="repToggle" type="button"><span><b>Wiederholen (Dauerauftrag)</b><small>Wird automatisch monatlich, vierteljährlich oder jährlich gebucht.</small></span><i class="sw"></i></button>
        <div id="repOpts" hidden>
          <div class="lbl">Intervall</div>
          <div class="seg three" id="repInt" style="font-size:14px"><button data-r="m">Monatlich</button><button data-r="q">Quartalsweise</button><button data-r="y">Jährlich</button></div>
          <label class="field"><span>Letzter Termin (optional)</span><input class="f" type="date" id="repUntil"></label>
          <div class="note" id="repPrev"></div>
        </div>
      </div>
      <div class="stack">
        <button class="btn" id="save">Speichern</button>
        <button class="btn sec" id="cancel" hidden>Abbrechen</button>
        <button class="btn danger" id="del" hidden>Buchung löschen</button>
      </div>
    </section>

    <section id="v-cats">
      <h2>Kategorien</h2>
      <div class="card">
        <div class="seg" id="catSeg"><button data-t="out">Ausgabe</button><button data-t="in">Einnahme</button></div>
        <div class="inline" style="margin-top:0">
          <input class="f" id="catName" placeholder="Neue Kategorie …" maxlength="40" autocomplete="off">
          <button class="btn sm" id="catAdd" aria-label="Kategorie hinzufügen"><span data-ic="plus"></span></button>
        </div>
      </div>
      <div id="catLists"></div>
    </section>

    <section id="v-accts">
      <h2>Konten</h2>
      <div class="card">
        <div class="inline" style="margin-top:0">
          <input class="f" id="acctName" placeholder="Neues Konto … (z. B. Girokonto)" maxlength="40" autocomplete="off">
          <button class="btn sm" id="acctAdd" aria-label="Konto hinzufügen"><span data-ic="plus"></span></button>
        </div>
      </div>
      <div id="acctList"></div>
    </section>

    <section id="v-excel"></section>
    <section id="v-orders"></section>
    <section id="v-loans"></section>
    <section id="v-settings"></section>
  </main>
  <nav><div>
    <button data-v="overview"><span data-ic="chart"></span>Übersicht</button>
    <button data-v="history"><span data-ic="receipt"></span>Verlauf</button>
    <button data-v="add" class="plus" aria-label="Neue Buchung"><span data-ic="plus"></span></button>
    <button data-v="stats"><span data-ic="trend"></span>Auswertung</button>
    <button data-v="more"><span data-ic="grid"></span>Mehr<span class="badge" id="badge" hidden></span></button>
  </div></nav>
  <div id="modal" hidden></div>
  <div id="toast"></div>
</div>
<input type="file" id="fileIn" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>

<script>
/*XL-START*/
const XL=(()=>{
const te=new TextEncoder(),td=new TextDecoder();
const CT=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;CT[n]=c>>>0;}
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CT[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0;};

/* ZIP (ohne Kompression) */
function zip(files){
  const chunks=[],cen=[];let off=0;
  const push=u=>{chunks.push(u);off+=u.length;};
  for(const f of files){
    const name=te.encode(f.name),data=te.encode(f.data),crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,33,true);
    h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,name.length,true);
    const lo=off;push(new Uint8Array(h.buffer));push(name);push(data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(14,33,true);
    c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,lo,true);
    cen.push(new Uint8Array(c.buffer),name);
  }
  const cs=off;cen.forEach(push);
  const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,off-cs,true);e.setUint32(16,cs,true);
  push(new Uint8Array(e.buffer));
  const out=new Uint8Array(off);let p=0;chunks.forEach(u=>{out.set(u,p);p+=u.length;});return out;
}
async function inflate(raw){
  const s=new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function unzip(buf){
  const u8=new Uint8Array(buf),dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
  let e=u8.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw new Error('Keine gültige xlsx-Datei');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const out={};
  for(let i=0;i<n;i++){
    if(dv.getUint32(p,true)!==0x02014b50)throw new Error('Zip beschädigt');
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nlen=dv.getUint16(p+28,true),elen=dv.getUint16(p+30,true),clen=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=td.decode(u8.subarray(p+46,p+46+nlen));
    const ds=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true);
    const raw=u8.subarray(ds,ds+csize);
    out[name]=method===0?raw:await inflate(raw);
    p+=46+nlen+elen+clen;
  }
  return out;
}

/* Schreiben: sheets=[{name,cols:[breiten],rows:[[Zelle]]}]  Zelle: Text | Zahl | {d:'YYYY-MM-DD'} | {h:'Kopfzeile'} */
const NS='http://schemas.openxmlformats.org/spreadsheetml/2006/main',RNS='http://schemas.openxmlformats.org/officeDocument/2006/relationships';

function sheetXml(sh){

    let cells='';
    r.forEach((v,ci)=>{
      if(v===''||v==null)return;
      const ref=colName(ci)+(ri+1);
      if(typeof v==='number')cells+=`<c r="${ref}" s="2"><v>${v}</v></c>`;
      else if(v.d)cells+=`<c r="${ref}" s="3"><v>${toSerial(v.d)}</v></c>`;
      else if(v.h!==undefined)cells+=`<c r="${ref}" s="1" t="inlineStr"><is><t>${xe(v.h)}</t></is></c>`;
      else cells+=`<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xe(v)}</t></is></c>`;
    });
    rows+=`<row r="${ri+1}">${cells}</row>`;
  });
  const cols=sh.cols.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('');
  return HEAD+`<worksheet xmlns="${NS}"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${cols}</cols><sheetData>${rows}</sheetData></worksheet>`;

  const files=[

const texts=s=>{let o='';s.replace(/<t\b[^>]*>([\s\S]*?)<\/t>/g,(m,t)=>{o+=unx(t);return m;});return o;};
const attrs=s=>{const o={};s.replace(/([\w:.-]+)="([^"]*)"/g,(m,k,v)=>{o[k]=unx(v);return m;});return o;};
async function read(buf){

  const shared=(txt('xl/sharedStrings.xml').match(/<si\b[^>]*>[\s\S]*?<\/si>|<si\s*\/>/g)||[]).map(si=>texts(si.replace(/<rPh\b[\s\S]*?<\/rPh>/g,'')));
  const names=[],sheets={};
  for(const t of(txt('xl/workbook.xml').match(/<sheet\b[^>]*>/g)||[])){
    const a=attrs(t);let target=rels[a['r:id']];if(!target)continue;
    target=target.startsWith('/')?target.slice(1):'xl/'+target;

}

const GS_CODE=`// Haushaltsbuch - Synchronisierung mit Google Sheets
// Dieses Skript gehoert in die Google-Tabelle: Erweiterungen > Apps Script
var KEY = '__KEY__';

var NAMES = ['Buchungen', 'Kategorien', 'Konten', 'Kontostände', 'Daueraufträge', 'Leihgaben'];
var FIELDS = { 'Buchungen': 'buchungen', 'Kategorien': 'kategorien', 'Konten': 'konten', 'Kontostände': 'kontostaende', 'Daueraufträge': 'dauerauftraege', 'Leihgaben': 'leihgaben' };
var TEXTCOLS = { 'Buchungen': [1, 2, 3, 5, 6, 7, 8], 'Kategorien': [1, 2, 3, 4], 'Konten': [1], 'Kontostände': [1, 2], 'Daueraufträge': [1, 2, 3, 5, 6, 7, 8, 9, 10, 12], 'Leihgaben': [1, 2, 3, 5, 6] };

function out_(obj) {
  obj.v = 3;
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}

function doGet() {
  return out_({ ok: true, info: 'Haushaltsbuch-Sync laeuft' });
}

function doPost(e) {
  var req;
  try { req = JSON.parse(e.postData.contents); } catch (err) { return out_({ error: 'Ungültige Anfrage' }); }
  if (req.key !== KEY) return out_({ error: 'Falscher Schlüssel' });
  var lock = LockService.getScriptLock();
  lock.waitLock(25000);
  try {
    var props = PropertiesService.getScriptProperties();
    var rev = Number(props.getProperty('rev') || 0);
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    if (req.action === 'rev') return out_({ ok: true, rev: rev });
    if (req.action === 'get') return out_({ ok: true, rev: rev, data: read_(ss) });
    if (req.action === 'put') {
      if (!req.force && req.rev !== rev) return out_({ ok: false, conflict: true, rev: rev, data: read_(ss) });
      write_(ss, req.data || {});
      rev = rev + 1;
      props.setProperty('rev', String(rev));
      return out_({ ok: true, rev: rev });
    }
    return out_({ error: 'Unbekannte Aktion' });
  } finally {
    lock.releaseLock();
  }
}

function read_(ss) {
  var tz = ss.getSpreadsheetTimeZone();
  var data = {};
  NAMES.forEach(function (n) {
    var sh = ss.getSheetByName(n);
    var rows = [];
    if (sh && sh.getLastRow() > 0 && sh.getLastColumn() > 0) {
      rows = sh.getRange(1, 1, sh.getLastRow(), sh.getLastColumn()).getValues().map(function (r) {
        return r.map(function (v) { return v instanceof Date ? Utilities.formatDate(v, tz, 'yyyy-MM-dd') : v; });
      });
    }
    data[FIELDS[n]] = rows;
  });
  return data;
}

function write_(ss, data) {
  NAMES.forEach(function (n) {
    var rows = data[FIELDS[n]] || [];
    var sh = ss.getSheetByName(n) || ss.insertSheet(n);
    sh.clear();
    if (!rows.length) return;
    var w = 0;
    rows.forEach(function (r) { if (r.length > w) w = r.length; });
    rows = rows.map(function (r) { var c = r.slice(); while (c.length < w) c.push(''); return c; });
    TEXTCOLS[n].forEach(function (c) { if (c <= w) sh.getRange(1, c, rows.length, 1).setNumberFormat('@'); });
    sh.getRange(1, 1, rows.length, w).setValues(rows);
    sh.getRange(1, 1, 1, w).setFontWeight('bold');
    sh.setFrozenRows(1);
  });
}`;

    try{j=JSON.parse(txt);}catch(e){throw new Error('Unerwartete Antwort – stimmt die Web-App-URL und steht der Zugriff auf „Jeder“?');}

}

      {k:'merge',label:'Zusammenführen (empfohlen)'},{k:'cloud',label:'Stand aus Google Sheets übernehmen',sec:1},{k:'local',label:'Meinen Stand behalten und hochladen',sec:1}]});

async function firstLink(){

async function syncNow(manual){

function gsUrlProblem(url){
  if(/^http:\/\/localhost/.test(url))return'';

  if(/\/(edit|home)(\/|\?|$)/.test(url)||/\/projects\//.test(url))return'Das ist die Adresse des Skript-Editors, nicht die der Web-App. Nimm die Adresse, die nach „Bereitstellen“ angezeigt wird (endet auf /exec).';
  if(/\/dev(\?|$)/.test(url))return'Diese Adresse endet auf /dev (Testversion) und funktioniert nur für dich im Editor. Nimm die Adresse der Bereitstellung, die auf /exec endet.';
  if(!/\/exec(\?|$)/.test(url))return'Die Web-App-Adresse muss auf /exec enden. Prüfe, ob sie vollständig kopiert wurde.';
  return'';
}

async function loanForm(l){

  if(!dir){dir=await choose({title:'Neuer Eintrag',options:[{k:'l',label:'Ich habe Geld verliehen'},{k:'b',label:'Ich habe Geld geliehen'}],cancel:'Abbrechen'});if(!dir)return;}
  const fields=[{label:dir==='b'?'Von wem?':'An wen?',value:l?l.name:''},{label:'Betrag (€)',value:l?fmtIn(l.amount):'',inputmode:'decimal'},{label:'Datum',value:l?l.date:todayISO(),type:'date'}];
  for(;;){
    const r=await dlg({title:l?'Eintrag bearbeiten':(dir==='b'?'Geliehen':'Verliehen'),fields,ok:'Speichern'});
    if(!r)return;
    r.forEach((v,i)=>fields[i].value=v);
    const name=r[0].trim(),amount=parseAmount(r[1]),date=r[2]||todayISO();
    if(!name){toast('Bitte einen Namen eingeben');continue;}
    if(!(amount>0)){toast('Bitte einen gültigen Betrag eingeben');continue;}

    changed();renderAll();toast('Gespeichert');return;
  }
}

/* ---------- Auswertung ---------- */
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dOf=iso=>new Date(iso+'T12:00:00');
const fmtD=iso=>dOf(iso).toLocaleDateString('de-DE');
const catNamesAll=type=>[...new Set([...catsOf(type).map(c=>c.name),...state.tx.filter(x=>x.type===type).map(x=>x.cat)])];
function statRange(){
  const n=new Date(),y=n.getFullYear(),m=n.getMonth(),end=isoOf(new Date(y,m+1,0));
  if(st.range==='month')return[isoOf(new Date(y,m,1)),end];
  if(st.range==='3m')return[isoOf(new Date(y,m-2,1)),end];
  if(st.range==='6m')return[isoOf(new Date(y,m-5,1)),end];
  if(st.range==='year')return[y+'-01-01',y+'-12-31'];
  if(st.range==='all'){const ds=state.tx.map(t=>t.date).sort(),t0=todayISO();return[ds[0]||isoOf(new Date(y,m,1)),ds.length&&ds[ds.length-1]>t0?ds[ds.length-1]:t0];}
  let f=st.from||isoOf(new Date(y,m,1)),t=st.to||end;if(f>t){const x=f;f=t;t=x;}return[f,t];
}
const statTx=()=>{const[f,t]=statRange();return state.tx.filter(x=>x.type!=='tr'&&x.date>=f&&x.date<=t&&(st.acct==='*'||x.acct===st.acct));};
function monday(iso){const d=dOf(iso);d.setDate(d.getDate()-((d.getDay()+6)%7));return isoOf(d);}
function bucketPlan(f,t){
  const n=Math.round((dOf(t)-dOf(f))/864e5)+1;
  let g=st.gran==='auto'?(n<=31?'day':n<=140?'week':'month'):st.gran,note='';
  if(g==='day'&&n>62){g='week';note='Zu viele Tage für die Tagesansicht – Wochenansicht gewählt.';}
  if(g==='week'&&n>450){g='month';note='Zeitraum zu lang für Wochen – Monatsansicht gewählt.';}
  const keyOf=g==='day'?(d=>d):g==='week'?monday:(d=>d.slice(0,7));
  const list=[];let cur=dOf(f);const end=dOf(t);
  if(g==='week')cur=dOf(monday(f));
  if(g==='month')cur=new Date(cur.getFullYear(),cur.getMonth(),1,12);
  while(cur<=end){
    list.push({k:g==='month'?cur.getFullYear()+'-'+pad(cur.getMonth()+1):isoOf(cur),d:new Date(cur)});
    if(g==='day')cur.setDate(cur.getDate()+1);else if(g==='week')cur.setDate(cur.getDate()+7);else cur.setMonth(cur.getMonth()+1);
  }
  return{g,note,keyOf,list};
}
function nice(min,max){
  if(max<=min)max=min+1;
  const raw=(max-min)/4,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p,step=(f<=1?1:f<=2?2:f<=5?5:10)*p;
  return{lo:Math.floor(min/step+1e-9)*step,hi:Math.ceil(max/step-1e-9)*step,step};
}
const shortN=v=>{const a=Math.abs(v);return a>=1000?(v/1000).toLocaleString('de-DE',{maximumFractionDigits:1})+'k':String(Math.round(v*100)/100).replace('.',',');};
const chipS=(k,v,label,on)=>`<button class="chip${on?' on':''}" data-stk="${k}" data-stv="${esc(v)}">${esc(label)}</button>`;
function renderStats(){
  if(st.acct!=='*'&&!state.accts.some(a=>a.name===st.acct))st.acct='*';
  const[f,t]=statRange();
  const R=[['month','Monat'],['3m','3 Monate'],['6m','6 Monate'],['year','Jahr'],['all','Alles'],['custom','Eigener']];
  const G=[['auto','Auto'],['day','Tag'],['week','Woche'],['month','Monat']];
  $('#stFilters').innerHTML=`<div class="lbl" style="margin-top:0">Zeitraum</div><div class="chips">${R.map(([v,l])=>chipS('range',v,l,st.range===v)).join('')}</div>`
    +(st.range==='custom'
      ?`<div class="dates"><label class="field" style="margin:0"><span>Von</span><input class="f" type="date" id="stFrom" value="${f}"></label><label class="field" style="margin:0"><span>Bis</span><input class="f" type="date" id="stTo" value="${t}"></label></div>`
      :`<div class="note">${fmtD(f)} – ${fmtD(t)}</div>`)
    +`<div class="lbl">Einteilung der Zeitachse</div><div class="chips">${G.map(([v,l])=>chipS('gran',v,l,st.gran===v)).join('')}</div>`
    +`<div class="lbl">Konto</div><div class="chips">${chipS('acct','*','Alle Konten',st.acct==='*')}${state.accts.map(a=>chipS('acct',a.name,a.name,st.acct===a.name)).join('')}</div>`;
  renderLine();renderPie();
}
function renderLine(){
  const[f,t]=statRange(),tx=statTx();
  if(!tx.length){$('#chLine').innerHTML='<div class="empty" style="padding:24px 8px">Keine Buchungen im gewählten Zeitraum.</div>';return;}
  const bp=bucketPlan(f,t),n=bp.list.length,idx={};
  bp.list.forEach((b,i)=>idx[b.k]=i);
  const inc=Array(n).fill(0),out=Array(n).fill(0);
  tx.forEach(x=>{const i=idx[bp.keyOf(x.date)];if(i!==undefined)(x.type==='in'?inc:out)[i]+=x.amount;});
  let c=0;const cum=inc.map((v,i)=>(c+=v-out[i]));
  const totI=inc.reduce((a,b)=>a+b,0),totO=out.reduce((a,b)=>a+b,0);
  const W=360,H=230,L=42,Rr=8,T=12,B=26,pw=W-L-Rr,ph=H-T-B;
  const sc=nice(Math.min(0,...cum),Math.max(0,...inc,...out,...cum));
  const y=v=>T+ph-(v-sc.lo)/(sc.hi-sc.lo)*ph,z=y(0);
  const slot=pw/n,bw=Math.max(1.5,Math.min(14,slot*.38));
  const multiYear=f.slice(0,4)!==t.slice(0,4),every=Math.ceil(n/7);
  const lab=(d)=>bp.g==='month'?d.toLocaleDateString('de-DE',{month:'short'}).replace('.','')+(multiYear?" '"+String(d.getFullYear()).slice(2):''):pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.';
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Umsatzverlauf">`;
  for(let i=0;sc.lo+i*sc.step<=sc.hi+1e-9;i++){const v=Math.round((sc.lo+i*sc.step)*1e6)/1e6,yy=y(v);s+=`<line class="gl" x1="${L}" x2="${W-Rr}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}"/><text class="axt" x="${L-5}" y="${(yy+3).toFixed(1)}" text-anchor="end">${shortN(v)}</text>`;}
  s+=`<line class="zl" x1="${L}" x2="${W-Rr}" y1="${z.toFixed(1)}" y2="${z.toFixed(1)}"/>`;
  const sel=st.sel!=null&&st.sel<n?st.sel:null;
  bp.list.forEach((b,i)=>{
    const cx=L+slot*(i+.5);
    if(sel===i)s+=`<rect class="sel" x="${(L+slot*i).toFixed(1)}" y="${T}" width="${slot.toFixed(1)}" height="${ph}"/>`;
    if(inc[i]>0)s+=`<rect class="bi" x="${(cx-bw-.5).toFixed(1)}" y="${y(inc[i]).toFixed(1)}" width="${bw.toFixed(1)}" height="${(z-y(inc[i])).toFixed(1)}" rx="1.5"/>`;
    if(out[i]>0)s+=`<rect class="bo" x="${(cx+.5).toFixed(1)}" y="${y(out[i]).toFixed(1)}" width="${bw.toFixed(1)}" height="${(z-y(out[i])).toFixed(1)}" rx="1.5"/>`;
    if(i%every===0)s+=`<text class="axt" x="${cx.toFixed(1)}" y="${H-8}" text-anchor="middle">${lab(b.d)}</text>`;
  });
  s+=`<polyline class="ln" points="${cum.map((v,i)=>(L+slot*(i+.5)).toFixed(1)+','+y(v).toFixed(1)).join(' ')}"/>`;
  if(n<=40)cum.forEach((v,i)=>{s+=`<circle class="pt" cx="${(L+slot*(i+.5)).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.5"/>`;});
  bp.list.forEach((b,i)=>{s+=`<rect data-bi="${i}" x="${(L+slot*i).toFixed(1)}" y="${T}" width="${slot.toFixed(1)}" height="${ph}" fill="transparent"/>`;});
  s+='</svg>';
  const full=d=>bp.g==='day'?d.toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'long',year:'numeric'}):bp.g==='week'?(()=>{const e=new Date(d);e.setDate(e.getDate()+6);return'Woche '+d.toLocaleDateString('de-DE',{day:'numeric',month:'numeric'})+' – '+e.toLocaleDateString('de-DE',{day:'numeric',month:'numeric',year:'numeric'});})():d.toLocaleDateString('de-DE',{month:'long',year:'numeric'});
  const iI=sel!=null?inc[sel]:totI,iO=sel!=null?out[sel]:totO;
  $('#chLine').innerHTML=s
    +'<div class="legend"><span><i class="sw bi"></i>Einnahmen</span><span><i class="sw bo"></i>Ausgaben</span><span><i class="sw ln"></i>Saldo (kumuliert)</span></div>'
    +`<div class="kpi-t">${sel!=null?'<b>'+esc(full(bp.list[sel].d))+'</b>':'Gesamter Zeitraum'}</div>`
    +`<div class="kpi" style="margin-top:6px"><div><small>Einnahmen</small><b class="pos">${eur(iI)}</b></div><div><small>Ausgaben</small><b class="neg">${eur(iO)}</b></div><div><small>Saldo</small><b class="${iI-iO<0?'neg':'pos'}">${eur(iI-iO)}</b></div></div>`
    +`<div class="note" style="text-align:center">${bp.note?esc(bp.note)+' ':''}Tippe auf einen Zeitabschnitt für Details.</div>`;
}
function renderPie(){
  const tx=statTx(),types=st.ptype==='both'?['out','in']:[st.ptype];
  const on=(type,name)=>!st.off.includes(type+':'+name);
  const chip=(type,name)=>`<button class="chip${on(type,name)?' on':''}" data-pc="${esc(type+':'+name)}"><i class="dot" style="background:${colorOf(name)};margin-right:6px"></i>${esc(name)}</button>`;
  let h=`<div class="chips">${[['out','Ausgaben'],['in','Einnahmen'],['both','Ein. vs. Aus.']].map(([v,l])=>chipS('ptype',v,l,st.ptype===v)).join('')}</div>`
    +'<div class="lbl">Kategorien</div>'
    +`<div class="chips" style="margin-bottom:8px"><button class="chip sm" data-pset="all">Alle</button><button class="chip sm" data-pset="none">Keine</button></div>`;
  types.forEach(type=>{
    if(types.length>1)h+=`<div class="note" style="margin:8px 2px 6px"><b>${type==='out'?'Ausgaben':'Einnahmen'}</b></div>`;
    h+=`<div class="chips">${catNamesAll(type).map(n=>chip(type,n)).join('')}</div>`;
  });
  const sums={};
  tx.forEach(x=>{if(types.includes(x.type)&&on(x.type,x.cat)){const k=x.type+':'+x.cat;sums[k]=(sums[k]||0)+x.amount;}});
  let slices,centerV,centerL;
  if(st.ptype==='both'){
    const sumT=ty=>Object.entries(sums).filter(([k])=>k.startsWith(ty+':')).reduce((a,[,v])=>a+v,0),i=sumT('in'),o=sumT('out');
    slices=[{name:'Einnahmen',v:i,color:'var(--in)'},{name:'Ausgaben',v:o,color:'var(--out)'}].filter(x=>x.v>0);
    centerV=i-o;centerL='Saldo';
  }else{
    slices=Object.entries(sums).map(([k,v])=>{const nm=k.slice(k.indexOf(':')+1);return{name:nm,v,color:colorOf(nm)};}).sort((a,b)=>b.v-a.v);
    centerV=slices.reduce((a,x)=>a+x.v,0);centerL=st.ptype==='in'?'Einnahmen':'Ausgaben';
  }
  const total=slices.reduce((a,x)=>a+x.v,0);
  if(!total){h+='<div class="empty" style="padding:20px 8px">Keine Daten für diese Auswahl im Zeitraum.</div>';$('#chPie').innerHTML=h;return;}
  const R=70,C=2*Math.PI*R;let acc=0;
  let svg='<svg viewBox="0 0 200 200" class="pie" role="img" aria-label="Anteile nach Kategorie">';
  slices.forEach(x=>{const dash=x.v/total*C;svg+=`<circle cx="100" cy="100" r="${R}" fill="none" style="stroke:${x.color}" stroke-width="38" stroke-dasharray="${dash.toFixed(3)} ${(C-dash).toFixed(3)}" stroke-dashoffset="${(-acc).toFixed(3)}" transform="rotate(-90 100 100)"/>`;acc+=dash;});
  svg+=`<text class="ctr" x="100" y="102" text-anchor="middle">${eur(centerV)}</text><text class="axt" x="100" y="119" text-anchor="middle">${centerL}</text></svg>`;
  h+='<div style="margin-top:14px">'+svg+'</div>'
    +slices.map(x=>`<div class="leg-row"><span><i class="dot" style="background:${x.color}"></i>${esc(x.name)}</span><span><b>${eur(x.v)}</b><small>${(x.v/total*100).toLocaleString('de-DE',{maximumFractionDigits:1})} %</small></span></div>`).join('');
  $('#chPie').innerHTML=h;
}

function show(v){
  view=v;if(MORE.includes(v))moreSub=v;
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));
  $('#moreTabs').hidden=!MORE.includes(v);
  $('#moreTabs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.m===v));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v||(b.dataset.v==='more'&&MORE.includes(v))));
  document.body.classList.toggle('nomonth',!(v==='overview'||v==='history'));
  if(v==='add'&&!editing&&!$('#dt').value)$('#dt').value=todayISO();
  if(v==='stats')renderStats();
  if(v==='orders')renderOrders();
  if(v==='loans')renderLoans();
  if(v==='settings')renderSettings();
  window.scrollTo(0,0);
}

function resetForm(){editing=null;editingOrder=null;addRepeat=false;addInt='m';addUntil='';addTo=null;newAcctFor='from';$('#repUntil').value='';$('#amt').value='';$('#note').value='';$('#dt').value=todayISO();$('#newcat').hidden=true;$('#newcatName').value='';$('#newacct').hidden=true;$('#newacctName').value='';}
function createInlineCat(){
  const n=addCategory($('#newcatName').value,addType);
  if(n){addCat=n;$('#newcat').hidden=true;$('#newcatName').value='';renderAdd();renderCats();toast('Kategorie „'+n+'“ angelegt');}
}
function createInlineAcct(){
  const n=addAccount($('#newacctName').value);
  if(n){if(newAcctFor==='to')addTo=n;else addAcct=n;newAcctFor='from';$('#newacct').hidden=true;$('#newacctName').value='';renderAdd();renderAccts();renderStats();toast('Konto „'+n+'“ angelegt');}
}
async function saveEntry(){
  if(!$('#newcat').hidden&&$('#newcatName').value.trim())createInlineCat();
  if(!$('#newacct').hidden&&$('#newacctName').value.trim())createInlineAcct();
  const tr=addType==='tr';
  const amount=parseAmount($('#amt').value);
  if(!(amount>0)){toast('Bitte einen Betrag eingeben');$('#amt').focus();return;}
  if(tr){
    if(state.accts.length<2){toast('Für Umbuchungen brauchst du mindestens zwei Konten');return;}
    if(!addAcct||!addTo||addAcct===addTo){toast('Bitte zwei verschiedene Konten wählen');return;}
  }else if(!addCat){toast('Bitte eine Kategorie wählen');return;}
  const date=$('#dt').value||todayISO();
  const rec={date,type:addType,cat:tr?'':addCat,amount,note:$('#note').value.trim(),acct:addAcct||state.accts[0].name};
  if(tr)rec.to=addTo;
  const rep=addRepeat||!!editingOrder;
  if(rep&&addUntil&&addUntil<date){toast('Das Enddatum liegt vor dem ersten Termin');return;}
  if(editingOrder){
    const o=state.orders.find(x=>x.id===editingOrder);
    if(o){
      const sched=o.start!==date||o.interval!==addInt;
      Object.assign(o,{type:rec.type,cat:rec.cat,acct:rec.acct,to:tr?rec.to:'',amount,note:rec.note,interval:addInt,start:date,until:addUntil||''});
      if(sched)o.n=pastCount(o);
    }
    runOrders();changed();resetForm();renderAll();show('orders');toast('Dauerauftrag gespeichert');return;
  }
  if(addRepeat&&!editing){
    const o={id:uid(),type:rec.type,cat:rec.cat,acct:rec.acct,to:tr?rec.to:'',amount,note:rec.note,interval:addInt,start:date,until:addUntil||'',n:0,active:true};
    const past=pastCount(o);
    if(past>0){
      const k=await choose({title:'Termine in der Vergangenheit',text:`Der erste Termin liegt in der Vergangenheit. ${past} Termin${past===1?' ist':'e sind'} bis gestern schon fällig.`,
        options:[{k:'back',label:`Nachbuchen (${past} Buchung${past===1?'':'en'})`},{k:'skip',label:'Nicht nachbuchen, erst ab heute',sec:1}],cancel:'Abbrechen'});
      if(!k)return;
      if(k==='skip')o.n=past;
    }
    state.orders.push(o);
    const r=runOrders();changed();resetForm();renderAll();show('orders');
    toast(r.made?`Dauerauftrag angelegt, ${r.made} Buchung${r.made===1?'':'en'} erstellt`:'Dauerauftrag angelegt');return;
  }
  if(editing){const t=state.tx.find(x=>x.id===editing);if(t){Object.assign(t,rec);if(!tr)delete t.to;}}
  else state.tx.push(Object.assign({id:uid()},rec));
  changed();
  const wasEdit=!!editing;
  ym=date.slice(0,7);resetForm();renderAll();
  if(wasEdit){show('history');toast('Änderungen gespeichert');}
  else{toast(tr?'Umbuchung gespeichert':'Gespeichert');$('#amt').focus();}
}
function editOrder(id){
  const o=state.orders.find(x=>x.id===id);if(!o)return;
  resetForm();editingOrder=id;addType=o.type;addCat=o.cat||null;addAcct=o.acct;addTo=o.to||null;addInt=o.interval;addUntil=o.until||'';addRepeat=true;
  $('#amt').value=String(o.amount).replace('.',',');$('#dt').value=o.start;$('#note').value=o.note||'';$('#repUntil').value=addUntil;
  renderAdd();show('add');
}
function editTx(id){
  const t=state.tx.find(x=>x.id===id);if(!t)return;
  editing=id;editingOrder=null;addRepeat=false;addType=t.type;addCat=t.cat||null;addAcct=t.acct;addTo=t.to||null;
  $('#amt').value=String(t.amount).replace('.',',');$('#dt').value=t.date;$('#note').value=t.note||'';
  renderAdd();show('add');
}

document.addEventListener('click',async e=>{
  if(e.target.closest('#modal'))return;
  const bi=e.target.closest('[data-bi]');
  if(bi){const i=+bi.dataset.bi;st.sel=st.sel===i?null:i;renderLine();return;}
  const el=e.target.closest('button,label');if(!el)return;
  if(el.dataset.v){if(el.dataset.v!=='add'&&(editing||editingOrder)){resetForm();renderAdd();}show(el.dataset.v==='more'?moreSub:el.dataset.v);return;}
  if(el.dataset.m){show(el.dataset.m);return;}
  if(el.dataset.theme){applyTheme(el.dataset.theme);renderSettings();return;}
  if(el.dataset.stk){
    if(el.dataset.stk==='range'&&el.dataset.stv==='custom'&&st.range!=='custom'){const[f,t]=statRange();st.from=f;st.to=t;}
    st[el.dataset.stk]=el.dataset.stv;st.sel=null;saveUI();renderStats();return;
  }
  if(el.dataset.pc){const k=el.dataset.pc,i=st.off.indexOf(k);if(i<0)st.off.push(k);else st.off.splice(i,1);saveUI();renderPie();return;}
  if(el.dataset.pset){
    const types=st.ptype==='both'?['out','in']:[st.ptype];
    st.off=st.off.filter(k=>!types.some(t=>k.startsWith(t+':')));
    if(el.dataset.pset==='none')types.forEach(t=>catNamesAll(t).forEach(n=>st.off.push(t+':'+n)));
    saveUI();renderPie();return;
  }
  if(el.closest('#acctChips')){
    if(el.id==='chipNewAcct'){newAcctFor='from';$('#newacct').hidden=false;$('#newacctName').focus();return;}
    if(el.dataset.a!==undefined){addAcct=el.dataset.a;renderAdd();}return;
  }
  if(el.id==='newacctOk'){createInlineAcct();return;}
  if(el.id==='acctAdd'){
    const n=$('#acctName').value.trim();if(!n)return;
    const had=state.accts.some(a=>a.name.toLowerCase()===n.toLowerCase());
    addAccount(n);$('#acctName').value='';renderAccts();renderAdd();renderStats();
    toast(had?'Gibt es schon':'Konto „'+n+'“ angelegt');return;
  }
  if(el.dataset.aren){
    const old=el.dataset.aren,n=await uiPrompt('Konto umbenennen',old,'Der neue Name gilt auch für alle bisherigen Buchungen auf diesem Konto.');
    if(!n||n===old)return;
    if(state.accts.some(a=>a.name.toLowerCase()===n.toLowerCase()&&a.name!==old)){toast('Name existiert bereits');return;}
    state.accts.find(a=>a.name===old).name=n;
    state.tx.forEach(x=>{if(x.acct===old)x.acct=n;if(x.to===old)x.to=n;});state.orders.forEach(o=>{if(o.acct===old)o.acct=n;if(o.to===old)o.to=n;});state.checks.forEach(c=>{if(c.acct===old)c.acct=n;});
    if(addAcct===old)addAcct=n;if(st.acct===old){st.acct=n;saveUI();}
    changed();renderAll();return;
  }
  if(el.dataset.arm){
    const name=el.dataset.arm;
    if(state.accts.length<2){toast('Mindestens ein Konto wird gebraucht');return;}
    const target=state.accts.find(a=>a.name!==name).name,c=state.tx.filter(x=>x.acct===name||x.to===name).length;
    const selfT=state.tx.filter(x=>x.type==='tr'&&((x.acct===name&&x.to===target)||(x.to===name&&x.acct===target))).length;
    if(!(await uiConfirm(`Konto „${name}“ löschen?`,(c?`${c} Buchung(en) werden auf „${target}“ verschoben.`:'Das Konto hat keine Buchungen.')+(selfT?`\n${selfT} Umbuchung(en) zwischen diesen beiden Konten entfallen dabei.`:''),'Löschen',true)))return;
    state.tx.forEach(x=>{if(x.acct===name)x.acct=target;if(x.to===name)x.to=target;});
    state.tx=state.tx.filter(x=>!(x.type==='tr'&&x.acct===x.to));
    state.orders.forEach(o=>{if(o.acct===name)o.acct=target;if(o.to===name)o.to=target;});
    state.orders=state.orders.filter(o=>!(o.type==='tr'&&o.acct===o.to));
    state.accts=state.accts.filter(a=>a.name!==name);state.checks=state.checks.filter(c=>c.acct!==name);
    if(addAcct===name)addAcct=null;changed();renderAll();return;
  }
  if(el.id==='prev'){shiftMonth(-1);return;}
  if(el.id==='next'){shiftMonth(1);return;}
  if(el.id==='status'){if(syncOn()&&(sync.err||sync.dirty)){syncNow(true);show('excel');}else if(!syncOn()&&FS&&linked()&&!fileReady)reconnect();else{show('excel');}return;}
  if(el.closest('#addSeg')){addType=el.dataset.t;addCat=null;renderAdd();return;}
  if(el.dataset.preset){
    if(state.accts.length<2){toast('Lege zuerst ein zweites Konto an (z. B. Girokonto).');addTo=null;newAcctFor='to';$('#newacct').hidden=false;$('#newacctName').focus();return;}
    const cash=cashAcct();
    if(el.dataset.preset==='withdraw'){addTo=cash;addAcct=otherAcct(cash);}else{addAcct=cash;addTo=otherAcct(cash);}
    renderAdd();return;
  }
  if(el.dataset.to!==undefined&&el.closest('#toChips')){addTo=el.dataset.to;renderAdd();return;}
  if(el.id==='chipNewTo'){newAcctFor='to';$('#newacct').hidden=false;$('#newacctName').focus();return;}
  if(el.id==='repToggle'){addRepeat=!addRepeat;renderAdd();return;}
  if(el.closest('#repInt')){addInt=el.dataset.r;renderAdd();return;}
  if(el.dataset.loan){loanMenu(el.dataset.loan);return;}
  if(el.dataset.oedit){editOrder(el.dataset.oedit);return;}
  if(el.dataset.otoggle){
    const o=state.orders.find(x=>x.id===el.dataset.otoggle);if(!o)return;
    if(o.active)o.active=false;else{o.active=true;o.n=Math.max(o.n,pastCount(o));}
    changed();renderAll();autoRun();toast(o.active?'Dauerauftrag fortgesetzt':'Dauerauftrag pausiert');return;
  }
  if(el.dataset.odel){
    const o=state.orders.find(x=>x.id===el.dataset.odel);if(!o)return;
    if(!(await uiConfirm('Dauerauftrag löschen?','Es werden keine weiteren Buchungen erstellt. Bereits gebuchte Termine bleiben im Verlauf erhalten.','Löschen',true)))return;
    state.orders=state.orders.filter(x=>x.id!==o.id);changed();renderAll();toast('Dauerauftrag gelöscht');return;
  }
  if(el.closest('#catSeg')){catType=el.dataset.t;renderCats();return;}
  if(el.closest('#chips')){
    if(el.id==='chipNew'){$('#newcat').hidden=false;$('#newcatName').focus();return;}
    if(el.dataset.c){addCat=el.dataset.c;renderAdd();}return;
  }
  if(el.id==='newcatOk'){createInlineCat();return;}
  if(el.id==='save'){saveEntry();return;}
  if(el.id==='cancel'){const wasO=!!editingOrder;resetForm();renderAdd();show(wasO?'orders':'history');return;}
  if(el.id==='del'){
    if(editingOrder){
      if(await uiConfirm('Dauerauftrag löschen?','Es werden keine weiteren Buchungen erstellt. Bereits gebuchte Termine bleiben erhalten.','Löschen',true)){state.orders=state.orders.filter(x=>x.id!==editingOrder);changed();resetForm();renderAll();show('orders');toast('Dauerauftrag gelöscht');}
      return;
    }
    if(await uiConfirm('Buchung löschen?','Diese Buchung wird endgültig gelöscht.','Löschen',true)){state.tx=state.tx.filter(x=>x.id!==editing);changed();resetForm();renderAll();show('history');toast('Gelöscht');}
    return;
  }
  if(el.classList.contains('entry')){editTx(el.dataset.id);return;}
  if(el.id==='catAdd'){
    const n=$('#catName').value.trim();if(!n)return;
    const ex0=state.cats.find(c=>c.type===catType&&c.name.toLowerCase()===n.toLowerCase()),had=!!ex0&&!ex0.hidden,wasH=!!ex0&&!!ex0.hidden;
    addCategory(n,catType);$('#catName').value='';renderCats();renderAdd();
    toast(had?'Gibt es schon':wasH?'Kategorie „'+n+'“ wieder eingeblendet':'Kategorie „'+n+'“ angelegt');return;
  }
  if(el.dataset.ren){
    const t=el.dataset.t,old=el.dataset.ren,c=state.tx.filter(x=>x.type===t&&x.cat===old).length;
    const n=await uiPrompt('Kategorie umbenennen',old,c?`Der neue Name gilt auch für die ${c} bisherigen Buchung${c===1?'':'en'} (auch in der Excel-Datei).`:'');
    if(!n||n===old)return;
    const clash=state.cats.find(x=>x.type===t&&x.name.toLowerCase()===n.toLowerCase()&&x.name!==old);
    if(clash){toast(clash.hidden?'Name gehört zu einer ausgeblendeten Kategorie – blende sie erst wieder ein':'Name existiert bereits');return;}
    state.cats.find(x=>x.type===t&&x.name===old).name=n;
    state.tx.forEach(x=>{if(x.type===t&&x.cat===old)x.cat=n;});
    st.off=st.off.map(k=>k===t+':'+old?t+':'+n:k);saveUI();
    if(addCat===old)addCat=n;
    changed();renderAll();toast(c?`Umbenannt – ${c} Buchung${c===1?'':'en'} angepasst`:'Umbenannt');return;
  }
  if(el.dataset.rm){
    const t=el.dataset.t,n=el.dataset.rm,c=state.tx.filter(x=>x.type===t&&x.cat===n).length;
    if(!(await uiConfirm(`Kategorie „${n}“ ausblenden?`,'Sie steht bei neuen Buchungen nicht mehr zur Auswahl.'+(c?`\nDie ${c} bisherigen Buchung${c===1?'':'en'} und die Excel-Daten bleiben unverändert erhalten.`:'')+'\nDu kannst sie jederzeit wieder einblenden.','Ausblenden',true)))return;
    const cat=state.cats.find(x=>x.type===t&&x.name===n);if(cat)cat.hidden=true;
    if(addCat===n)addCat=null;changed();renderAll();toast('Kategorie ausgeblendet');return;
  }
  if(el.dataset.show){
    const cat=state.cats.find(x=>x.type===el.dataset.t&&x.name===el.dataset.show);
    if(cat){cat.hidden=false;changed();renderAll();toast('Kategorie wieder eingeblendet');}return;
  }
  const act=el.dataset.act;if(!act)return;
  if(act==='create')createFile();
  else if(act==='open')openFile();
  else if(act==='save'){await writeFile();toast('In Datei gespeichert');}
  else if(act==='dir')connectDir();
  else if(act==='reload')reloadFile();
  else if(act==='bannerOff'){try{sessionStorage.setItem('hb.bannerOff','1');}catch(e){}renderBanner();}
  else if(act==='reconnect')reconnect();
  else if(act==='disc')disconnect();
  else if(act==='download')download();
  else if(act==='share')share();
  else if(act==='import')$('#fileIn').click();
  else if(act==='persist'){try{persisted=await navigator.storage.persist();}catch(e){persisted=false;}renderSettings();toast(persisted?'Speicher geschützt':'Der Browser hat den Schutz abgelehnt');}
  else if(act==='gsConnect')gsConnect();
  else if(act==='gsTest')gsTest();
  else if(act==='gsSync')syncNow(true);
  else if(act==='gsDisc')gsDisconnect();
  else if(act==='copyScript')copyScript();
  else if(act==='acctToggle'){try{localStorage.setItem('hb.showAcct',showAcct()?'0':'1');}catch(e){}renderOverview();}
  else if(act==='loanNew')loanForm(null);
  else if(act==='orderNew'){resetForm();addRepeat=true;addType='out';addCat=null;renderAdd();show('add');}
  else if(act==='balances')askBalances(targetMonth(),true);
  else if(act==='balancesAll')askBalances(targetMonth(),false);
  else if(act==='wipe'){
    if(await uiConfirm('Alle Daten löschen?','Alle Buchungen, Kategorien, Konten und Kontostände werden gelöscht'+(syncOn()?' – auch in Google Sheets':'')+'. Das kann nicht rückgängig gemacht werden.','Alles löschen',true)){
      state=defaults();state.meta.dirty=1;persist();markSyncDirty();if(fileHandle&&fileReady)writeFile();addCat=null;renderAll();toast('Alle Daten gelöscht');
    }
  }
});
function shiftMonth(d){let y=+ym.slice(0,4),m=+ym.slice(5)+d;while(m<1){m+=12;y--;}while(m>12){m-=12;y++;}ym=y+'-'+pad(m);renderAll();}
$('#fileIn').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)importFile(f);});
$('#newacctName').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();createInlineAcct();}});
$('#acctName').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#acctAdd').click();}});
document.addEventListener('input',e=>{
  if(e.target.id==='gsUrl'){gsDraft.url=e.target.value;saveDraft();}
  else if(e.target.id==='gsKey'){gsDraft.key=e.target.value;saveDraft();}
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')return;autoRun();if(syncOn()&&Date.now()-lastTry>8000){lastTry=Date.now();syncNow();}});
window.addEventListener('online',()=>{if(syncOn())syncNow();});
document.addEventListener('change',e=>{
  if(e.target.id==='stFrom'||e.target.id==='stTo'){st[e.target.id==='stFrom'?'from':'to']=e.target.value;st.sel=null;saveUI();renderStats();}
});
$('#newcatName').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();createInlineCat();}});
$('#catName').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#catAdd').click();}});
$('#dt').addEventListener('change',renderRepPrev);
$('#repUntil').addEventListener('change',e=>{addUntil=e.target.value;renderRepPrev();});
$('#amt').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();saveEntry();}});

/* ---------- Start ---------- */
hydrateIcons();applyTheme(getTheme());
try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(getTheme()==='system')applyTheme('system');});}catch(e){}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
try{if(navigator.storage&&navigator.storage.persisted)navigator.storage.persisted().then(v=>{persisted=v;if(!v&&navigator.storage.persist)return navigator.storage.persist().then(r=>{persisted=r;});}).then(()=>renderSettings()).catch(()=>{});}catch(e){}
$('#dt').value=todayISO();
renderAll();show('overview');autoRun();
(async()=>{
  if(FS){
    try{
      const d=await idbGet('dir');
      if(d){
        dirHandle=d;renderStatus();renderExcel();
        if((await d.queryPermission({mode:'readwrite'}))==='granted')await syncDir(false);
      }else{
        const h=await idbGet('handle');
        if(h){
          fileHandle=h;renderStatus();renderExcel();
          if((await h.queryPermission({mode:'readwrite'}))==='granted')await syncHandle(false);
        }
      }
    }catch(e){}
  }
  if(syncOn()){lastTry=Date.now();await Promise.race([syncNow(),new Promise(r=>setTimeout(r,6000))]);}
  maybeAsk();
})();
window.__hb={get state(){return state},get st(){return st},get sync(){return sync},workbookBytes,parseWorkbook,parseTables,tables,startBal,endBal,syncNow};
})();
</script>
